# Publishes the web flasher (device/flasher/ with the firmware it flashes) to
# GitHub Pages: https://codino-labs.github.io/codino/, which
# devicelink.FlasherURL and the README point to. `make -C device flasher`
# builds it as it does locally, with PlatformIO and ESP Web Tools pinned in
# device/Makefile (cached between runs).
name: Web flasher

on:
  push:
    branches: [main]
    paths:
      - "device/**"
      - "protocol/**"
      - ".github/workflows/flasher.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/codino-toolchain
          key: toolchain-${{ hashFiles('device/Makefile', 'device/firmware/platformio.ini') }}
      - run: make -C device flasher
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: device/build/flasher

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
