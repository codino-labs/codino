; Firmware shell for the reference board (Waveshare ESP32-S3-Matrix): the
; Device core (../core) and the shell's portable parts (../shell) on the
; Arduino core with FastLED. Build with `make -C device firmware`; flash and
; check it on the board with docs/hardware/reference-board.md.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
framework = arduino
; The ESP32-S3FH4R2 of the reference board: 4 MB of flash in the package.
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
lib_deps = fastled/FastLED@3.9.4
; The portable code lives outside src/.
build_src_filter = +<*> +<../../core/*.cpp> +<../../shell/*.cpp>
build_unflags = -std=gnu++11 -DARDUINO_USB_MODE=1
build_flags =
  -std=gnu++17
  -I../core -I../shell -isystem ../third_party
  -DFIRMWARE_VERSION=\"0.1.0\"
  ; USB through TinyUSB (USB-OTG), not the USB-Serial/JTAG peripheral, whose
  ; descriptors are fixed: the CDC port then carries our product string.
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DUSB_PRODUCT=\"Codino\"
  -DUSB_MANUFACTURER=\"Codino\"
  ; Nothing but protocol lines on the CDC port (core logs go to UART0 anyway).
  -DCORE_DEBUG_LEVEL=0
build_src_flags = -Wall -Wextra
